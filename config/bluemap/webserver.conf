# The port of the web-server
port: 8101

# The base-path of the web-server
prefix: "/"

# Whether the web-server should use HTTPS (requires certificate + key)
https: false

# Bind a todas las interfaces (0.0.0.0 = cualquier host, portable para nube)
bind-address: "0.0.0.0"
